[package]
name = "moyodb-engine"
version = "1.0.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Experimental Rust/WASM transactional key-value storage engine for browser apps."
repository = "https://github.com/eluvane/MoyoDB"
readme = "../../README.md"

[lib]
name = "moyodb_engine"
crate-type = [ "cdylib", "rlib" ]

[features]
default = [  ]

[package.metadata.cargo-machete]
ignored = [ "serde_bytes" ]

# wasm-pack 0.13 and 0.15 ship binaryen 117, which rejects Rust's bulk memory
# and saturating float truncations unless those features are enabled.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]

[lints]
workspace = true

[dependencies]
crc32fast = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zerocopy = { workspace = true }
wasm-bindgen = { version = "0.2.128", features = [ "serde-serialize" ] }
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
criterion = { version = "0.8.2", features = [ "html_reports" ] }

[[bench]]
name = "btree"
harness = false

[[bench]]
name = "wal"
harness = false

[[bench]]
name = "recovery"
harness = false
[[bench]]
name = "commit"
harness = false
