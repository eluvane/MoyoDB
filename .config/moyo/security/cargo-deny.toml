[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
]
exceptions = [
    { allow = [ "LicenseRef-MoL-1.0" ], crate = "moyodb-engine" },
]

[[licenses.clarify]]
crate = "moyodb-engine"
expression = "LicenseRef-MoL-1.0"
license-files = [
    { path = "../../LICENSE", hash = 0xc5c517e8 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
