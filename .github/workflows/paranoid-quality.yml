name: Quality

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 2'

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '24.21.0'
  RUST_TOOLCHAIN: '1.98.1'

jobs:
  paranoid-linters:
    name: Full
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.7'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master; toolchain 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-online --registry=https://registry.npmjs.org/
      - name: Install external paranoid tooling
        run: |
          set -euo pipefail
          python -m pip install --user yamllint==1.38.0 'setuptools<81' semgrep==1.177.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-machete --version 0.9.2
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
      - name: Install wasm-pack
        run: node scripts/ci/install-wasm-pack.mjs
      - name: Install Playwright browsers
        run: npm exec --workspace @moyodb/sdk -- playwright install --with-deps
      - name: Run paranoid local gate
        run: npm run check:paranoid
