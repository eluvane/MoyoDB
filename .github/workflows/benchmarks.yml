name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.21.0'
  RUST_TOOLCHAIN: '1.98.1'

jobs:
  benchmark:
    name: Baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master; toolchain 1.98.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-online --registry=https://registry.npmjs.org/
      - name: Install wasm-pack
        run: node scripts/ci/install-wasm-pack.mjs
      - name: Install Playwright browsers
        run: npm exec --workspace @moyodb/sdk -- playwright install --with-deps
      - name: Run benchmarks and collect baseline
        run: npm run bench:collect -- --out-dir .benchmark/current
      - name: Publish baseline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-baseline
          path: .benchmark/current
          retention-days: 90
      - name: Append baseline summary
        run: cat .benchmark/current/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Find previous successful benchmark run
        id: previous-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'benchmarks.yml',
              branch: context.ref.replace('refs/heads/', ''),
              status: 'success',
              per_page: 20,
            });
            const previous = runs.data.workflow_runs.find((run) => run.id !== context.runId);
            core.setOutput('run-id', previous ? String(previous.id) : '');
      - name: Download previous baseline artifact
        if: steps.previous-run.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmark-baseline
          path: .benchmark/previous
          run-id: ${{ steps.previous-run.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Compare against previous baseline
        run: |
          set -euo pipefail
          npm run bench:compare -- \
            --previous .benchmark/previous/baseline.json \
            --current .benchmark/current/baseline.json \
            --out-dir .benchmark/comparison
      - name: Publish comparison artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-comparison
          path: .benchmark/comparison
          retention-days: 90
      - name: Append comparison summary
        run: cat .benchmark/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
